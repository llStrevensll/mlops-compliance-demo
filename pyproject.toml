readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlflow>=2.18",
    "numpy>=1.26,<2.3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]
